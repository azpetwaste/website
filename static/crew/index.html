<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>APW Field Desk</title>
<link rel="icon" href="/assets/img/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
:root{color-scheme:dark;--bg:#000;--bg2:#0B0D14;--ink:#FFF;--mute:#8B90A3;--dim:#4A4F62;--line:rgba(255,255,255,.12);--accent:#FF4A1C;--ok:#3DDC97;--warn:#FFB020;--bad:#FF5A5A}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}
.lbl{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:11px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.narrow{max-width:460px;margin:0 auto;padding:0 20px}
header.bar{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header.bar .in{display:flex;align-items:center;gap:16px;height:52px}
.brand{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.22em}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:0 12px;height:52px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap;border-bottom:2px solid transparent}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.tab .n{color:var(--accent);margin-left:6px}
.out{background:none;border:0;color:var(--dim);cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.prog{height:2px;background:var(--line)}
.prog i{display:block;height:2px;background:var(--accent);transition:width .4s}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;width:100%;min-height:64px;border:0;border-radius:2px;background:var(--accent);color:#000;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{min-height:44px;font-size:12px;width:auto;padding:0 16px}
.link{background:none;border:0;padding:8px 0;color:var(--mute);cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px}
input.f,select.f,textarea.f{width:100%;min-height:52px;padding:12px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:2px;font-size:17px;outline:none}
textarea.f{min-height:84px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{border-color:var(--ink)}
.err{color:var(--bad);font-size:14px;margin:10px 0 0;min-height:20px}
.ok{color:var(--ok)}
.hr{height:1px;background:var(--line);margin:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#000;padding:12px 18px;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;z-index:50;max-width:90vw;text-align:center}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* sign in */
.signin{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:40px 0}
.signin .stitle{font-size:40px;line-height:1;letter-spacing:-.04em;margin:14px 0 30px;font-weight:800}

/* route */
.big{font-size:34px;line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:6px 0 0}
.gate{font-family:"IBM Plex Mono",monospace;font-size:44px;font-weight:600;letter-spacing:.06em;line-height:1;margin-top:6px}
.kv{display:grid;grid-template-columns:96px 1fr;gap:10px 14px;margin:0;padding:18px 0;border-top:1px solid var(--line)}
.kv dt{margin:0}
.kv dd{margin:0;font-size:17px;line-height:1.4}
.tag{display:inline-block;padding:3px 8px;border:1px solid currentColor;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}.tag.acc{color:var(--accent)}.tag.dim{color:var(--mute)}
.dock{position:sticky;bottom:0;background:linear-gradient(transparent,#000 24%);padding:28px 0 calc(18px + env(safe-area-inset-bottom))}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.check{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:0 16px;margin-top:8px;background:transparent;border:1px solid var(--line);border-radius:2px;cursor:pointer;text-align:left;font-size:18px;font-weight:700}
.check i{width:24px;height:24px;border:1.5px solid var(--mute);border-radius:50%;flex:0 0 24px;display:grid;place-items:center;font-style:normal;font-size:14px}
.check.on{border-color:var(--ok)}
.check.on i{background:var(--ok);border-color:var(--ok);color:#000}
.shot{width:100%;max-height:260px;object-fit:cover;display:block;margin-top:12px;border:1px solid var(--line)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list .n{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute)}
.list .a{font-size:16px;font-weight:600;line-height:1.25}
.list .s{font-size:13px;color:var(--mute);margin-top:2px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:flex;align-items:flex-end}
.sheet .pane{width:100%;max-width:520px;margin:0 auto;background:var(--bg2);border-top:1px solid var(--line);padding:22px 20px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.texts{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;margin-top:14px;border:1px solid var(--accent);color:var(--accent);cursor:pointer;background:transparent;width:100%;font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase}

/* office */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0}
.stat{padding:16px 14px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:"IBM Plex Mono",monospace;font-size:34px;font-weight:500;line-height:1;margin-top:8px}
.daynav{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.daynav h2{margin:0 8px 0 0;font-size:28px;letter-spacing:-.03em}
.arrow{width:40px;height:40px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:16px}
.sec{margin:28px 0 0}
.sec h3{margin:0 0 4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:18px;letter-spacing:-.01em}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);padding:10px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--bg2)}
.ib{background:transparent;border:1px solid var(--line);min-width:32px;height:30px;cursor:pointer;font-size:12px;padding:0 8px;font-family:"IBM Plex Mono",monospace;letter-spacing:.06em}
.ib:hover{border-color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.t a[href^="tel:"]{display:inline-block;padding:10px 0;min-height:40px}select.ib{min-height:40px}
.chip{min-height:40px;background:transparent;border:1px solid var(--line);padding:7px 12px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.chip.on{color:var(--ink);border-color:var(--ink)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:30;overflow:auto;padding:20px 22px 40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fl{display:block;margin-top:14px}
.fl .lbl{display:block;margin-bottom:6px}
.empty{padding:28px 0;color:var(--mute);font-size:15px}
.scroll{overflow-x:auto}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.wk button{background:transparent;border:1px solid var(--line);min-height:58px;cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:0}
.wk button b{display:block;font-size:17px;letter-spacing:0;color:inherit;margin-top:2px;font-weight:500}
.wk button.on{border-color:var(--ink);color:var(--ink);background:var(--bg2)}
.wk button.now{color:var(--accent)}
.list li.tap{cursor:pointer}
.list li.tap:hover{background:var(--bg2)}
.list .r{text-align:right}
.rhead{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 0;cursor:pointer;text-align:left;min-height:56px}
.rhead b{font-size:18px;letter-spacing:-.01em}
.rhead .c{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--mute);white-space:nowrap}
.acts1 .btn{margin-top:8px}
.tcard{border-top:1px solid var(--line);padding:16px 0}
.tcard p{margin:8px 0 12px;font-size:15px;line-height:1.45}
.tcard .acts{display:grid;grid-template-columns:2fr 1fr;gap:8px;max-width:420px}
.sendrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:0 16px;margin-top:14px;border:1px solid var(--accent);color:var(--accent);text-decoration:none;font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
@media (max-width:640px){header.bar .in{flex-wrap:wrap;height:auto;padding-top:6px}header.bar .brand{flex:1;line-height:36px}header.bar .out{min-height:36px}header.bar .tabs{order:3;flex:0 0 100%;margin:0 -4px}.tab{height:46px;padding:0 11px}.ib{min-height:44px;min-width:44px}.chip{min-height:44px}.link{padding:14px 0}.daynav{flex-wrap:wrap}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}.hide-s{display:none}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Arizona Pet Waste field desk</h1>
<div id="app"></div>
<script>
  /* ---------- bot check (Cloudflare Turnstile). Off until TURNSTILE_SITE_KEY is set in Cloudflare. ---------- */
  async function botCheck() {
    var key = null;
    try { key = (await (await fetch('/api/config')).json()).turnstileKey; } catch (e) { }
    if (!key) return null;
    return new Promise(function (resolve) {
      var done = false, box = document.createElement('div');
      box.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999';
      function end(t) { if (done) return; done = true; resolve(t || null); setTimeout(function () { box.remove(); }, 300); }
      function draw() {
        document.body.appendChild(box);
        try { window.turnstile.render(box, { sitekey: key, appearance: 'interaction-only', callback: end, 'error-callback': function () { end(null); } }); } catch (e) { end(null); }
      }
      setTimeout(end, 30000);
      if (window.turnstile) return draw();
      var s = document.createElement('script');
      s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      s.onload = draw; s.onerror = function () { end(null); };
      document.head.appendChild(s);
    });
  }

(function () {
  'use strict';
  var app = document.getElementById('app');
  var KEY = 'apw.staff';
  var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var PLAN = { week: 'Weekly', twice: '2x week', eow: 'Every other wk' };
  var REASONS = [['gate_locked', 'Gate locked'], ['dog_out', 'Dog in the yard'], ['weather', 'Weather'], ['other', 'Other']];
  var S = { view: null, tab: 'today', day: null, data: {}, sel: null, check: {}, busy: false };
  var DEMO = /[?&]demo\b/.test(location.search);
  // Crashes in this app go to the Health tab so the office sees them.
  var sentErr = 0;
  function report(msg, detail) { if (DEMO || sentErr++ > 4) return; try { fetch('/api/log', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ source: 'crew', path: '/crew ' + (S.view || '') + ' ' + (S.tab || ''), message: String(msg).slice(0, 300), detail: String(detail || '').slice(0, 1200) }), keepalive: true }); } catch (e) { } }
  window.addEventListener('error', function (e) { report(e.message, (e.filename || '') + ':' + (e.lineno || '') + ' ' + ((e.error && e.error.stack) || '')); });
  window.addEventListener('unhandledrejection', function (e) { report('Promise: ' + ((e.reason && e.reason.message) || e.reason), e.reason && e.reason.stack); });

  /* ---------- helpers ---------- */
  function h(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function phone(p) { p = String(p || '').replace(/\D/g, ''); return p.length === 10 ? p.slice(0, 3) + '.' + p.slice(3, 6) + '.' + p.slice(6) : p; }
  function money(c) { return '$' + Math.round((c || 0) / 100).toLocaleString(); }
  function time(iso) { return iso ? new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Phoenix' }) : ''; }
  function ago(iso) { if (!iso) return ''; var m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' hr ago'; }
  function dayLabel(d) { var x = new Date(d + 'T19:00:00Z'); return x.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'America/Phoenix' }); }
  function shift(d, n) { return new Date(Date.parse(d + 'T19:00:00Z') + n * 864e5).toISOString().slice(0, 10); }
  function sms(to, body) { return 'sms:+1' + String(to).replace(/\D/g, '').slice(-10) + '?&body=' + encodeURIComponent(body); }
  function maps(addr) { return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(addr + ', AZ'); }
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  var STATUS = {
    scheduled: ['Scheduled', 'dim'], on_the_way: ['On the way', 'acc'], here: ['Here', 'warn'], done: ['Done', 'ok'], skipped: ['Skipped', 'dim'], cant: ["Can't service", 'bad'],
    trialing: ['Free month', 'ok'], active: ['Paying', 'ok'], past_due: ['Past due', 'bad'], paused: ['Paused', 'warn'], canceled: ['Canceled', 'dim'], checkout: ['Started', 'warn'], new: ['New', 'dim'],
    contacted: ['Contacted', 'warn'], quoted: ['Quoted', 'warn'], won: ['Won', 'ok'], lost: ['Lost', 'dim'], planned: ['Planned', 'dim'], live: ['Live', 'acc']
  };
  function tag(st) { var x = STATUS[st] || [st, 'dim']; return '<span class="tag ' + x[1] + '">' + h(x[0]) + '</span>'; }

  /* ---------- session ---------- */
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) { } }
  async function token() {
    var s = load();
    if (!s) return null;
    if (s.expires_at - 60 > Date.now() / 1000) return s.access_token;
    try {
      var r = await raw('POST', '/api/staff/refresh', { refresh_token: s.refresh_token });
      Object.assign(s, r.session); save(s); return s.access_token;
    } catch (e) { if (e.status === 401) signOut(); return null; }
  }
  async function raw(method, path, body, t) {
    var headers = { 'content-type': 'application/json' };
    if (t) headers.authorization = 'Bearer ' + t;
    var r = await fetch(path, { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
    var d = null; try { d = await r.json(); } catch (e) { }
    if (!r.ok) { var e = new Error((d && d.error) || 'Something went wrong. Try again.'); e.status = r.status; e.code = d && d.code; throw e; }
    return d || {};
  }
  async function api(method, path, body) {
    if (DEMO) return demoApi(method, path, body || {});
    var t = await token();
    if (!t) { signOut(); throw new Error('Please sign in again.'); }
    try { return await raw(method, path, body, t); }
    catch (e) { if (e.status === 401) signOut(); throw e; }
  }
  function signOut() { if (DEMO) { location.href = '/crew/'; return; } try { localStorage.removeItem(KEY); } catch (e) { } stopGps(); S.view = 'signin'; render(); }

  /* ---------- demo: made up data that lives in this browser tab only ---------- */
  var D = null;
  function demoSeed() {
    var today = new Date(Date.now() - 7 * 3600e3).toISOString().slice(0, 10), wd = new Date(today + 'T19:00:00Z').getUTCDay();
    var FN = ['Dana', 'Chris', 'Lee', 'Pat', 'Sky', 'Remy', 'Alex', 'Jo', 'Sam', 'Kai', 'Drew', 'Robin', 'Jesse', 'Casey', 'Morgan', 'Avery', 'Quinn', 'Reese', 'Blake', 'Toni'];
    var LN = ['Ruiz', 'Park', 'Morgan', 'Quinn', 'Bell', 'Cole', 'Hart', 'Lane', 'Reed', 'Stone', 'Shaw', 'Wells', 'Cruz', 'Frost', 'Boyd', 'Marsh', 'Hale', 'Rowe', 'Voss', 'Nash', 'Pike', 'Dunn', 'Kerr', 'Lowe', 'Tate'];
    var ST = ['Sample St', 'Example Ave', 'Demo Ln', 'Test Ct', 'Mock Rd', 'Placeholder Way', 'Pretend Pl', 'Trial Dr'];
    var DOGS = ['Milo', 'Bean', 'Rosie', 'Ace', 'Duke', 'Pip', 'Luna', 'Moose', 'Otis', 'Kona', 'Taz', 'Bear'];
    var ZIP = [['85326', 'buckeye'], ['85396', 'buckeye'], ['85338', 'goodyear'], ['85395', 'goodyear'], ['85340', 'litchfield'], ['85355', 'waddell']];
    var team = [{ id: 's1', name: 'Joe', email: 'owner@example.com', phone: '6235550100', role: 'owner', active: true }, { id: 's2', name: 'Sam', email: 'sam@example.com', phone: '6235550101', role: 'scooper', active: true },
      { id: 's3', name: 'Alex', email: 'alex@example.com', phone: '6235550102', role: 'scooper', active: true }, { id: 's4', name: 'Riley', email: 'riley@example.com', phone: '6235550103', role: 'scooper', active: true }];
    var cs = [];
    for (var i = 0; i < 500; i++) {
      var z = ZIP[i % ZIP.length], dogs = 1 + (i % 3), first = FN[i % FN.length];
      cs.push({ id: 'c' + (i + 1), name: first + ' ' + LN[(i * 7) % LN.length], email: first.toLowerCase() + (i + 1) + '@example.com', phone: '623555' + String(1000 + i), address: (100 + i * 3) + ' ' + ST[(i * 5) % ST.length], zip: z[0], area: z[1],
        dogs: dogs, dog_names: DOGS.slice(i % 9, i % 9 + dogs).join(', '), gate_code: i % 4 === 0 ? '' : String(1000 + (i * 37) % 9000), gate_notes: i % 6 === 0 ? 'Side gate on the left.' : '', problem_spots: i % 9 === 0 ? 'Back corner by the shed.' : '', office_notes: '', skip_spray: i % 11 === 0,
        plan: i % 10 === 0 ? 'twice' : i % 7 === 0 ? 'eow' : 'week', status: i % 40 === 39 ? 'past_due' : i % 5 === 0 ? 'trialing' : 'active', lat: 33.43 + (i % 50) / 500, lng: -112.36 - (i % 30) / 300,
        service_day: 1 + (i % 5), service_day2: null, eow_week: 0, stop_order: null, scooper_id: 's' + (2 + (i % 3)), texts_visit: i % 8 !== 0, texts_deals: false, pause_from: null, pause_until: null });
    }
    cs[4].service_day = null; cs[4].scooper_id = null; cs[17].service_day = null; cs[17].scooper_id = null; cs[33].service_day = null; cs[33].scooper_id = null;
    var runDay = wd >= 1 && wd <= 5 ? wd : 1;
    var routes = [2, 3, 4].map(function (n) { return { id: 'r' + (n - 1), status: 'planned', staff: { id: 's' + n, name: team[n - 1].name } }; });
    var stops = cs.filter(function (c) { return c.service_day === runDay && c.status !== 'past_due'; }).map(function (c, k) {
      return { id: 'st' + (k + 1), route_id: 'r' + (+c.scooper_id.slice(1) - 1), day: today, position: k + 1, status: 'scheduled', code: 'DEMO01', note: null, reason: null, photo_path: null, no_photo: false, on_way_at: null, arrived_at: null, done_at: null, customer: c };
    });

      (c.plan === 'eow' ? '<label class="fl"><span class="lbl">Every other week</span><select class="f" id="f_eow"><option value="0"' + (c.eow_week ? '' : ' selected') + '>Week A</option><option value="1"' + (c.eow_week ? ' selected' : '') + '>Week B</option></select></label>' : '') +
      '<label class="fl"><span class="lbl">Stop order</span><input class="f" id="f_so" inputmode="numeric" value="' + h(c.stop_order == null ? '' : c.stop_order) + '" placeholder="1, 2, 3…"></label>' +
      '<label class="fl"><span class="lbl">Scooper</span><select class="f" id="f_sc"><option value="">Default</option>' + team.filter(function (m) { return m.active; }).map(function (m) { return '<option value="' + m.id + '"' + (c.scooper_id === m.id ? ' selected' : '') + '>' + h(m.name) + '</option>'; }).join('') + '</select></label>' +
      '<label class="fl"><span class="lbl">Pause from</span><input class="f" id="f_pf" type="date" value="' + h(c.pause_from || '') + '"></label><label class="fl"><span class="lbl">Pause until</span><input class="f" id="f_pu" type="date" value="' + h(c.pause_until || '') + '"></label></div>' +
      '<div class="hr" style="margin:20px 0 4px"></div><span class="lbl">Yard</span><div class="grid2"><label class="fl"><span class="lbl">Gate code</span><input class="f mono" id="f_gc" value="' + h(c.gate_code || '') + '"></label><label class="fl"><span class="lbl">Dog names</span><input class="f" id="f_dn" value="' + h(c.dog_names || '') + '"></label></div>' +
      '<label class="fl"><span class="lbl">Gate notes</span><textarea class="f" id="f_gn">' + h(c.gate_notes || '') + '</textarea></label><label class="fl"><span class="lbl">Problem spots</span><textarea class="f" id="f_ps">' + h(c.problem_spots || '') + '</textarea></label>' +
      '<label class="fl"><span class="lbl">Dogs on the plan (1 to 6). Changing this changes the bill and emails the customer.</span><input class="f" id="f_dg" inputmode="numeric" value="' + h(c.dogs == null ? '' : c.dogs) + '"></label>' +
      '<label class="fl" style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="f_ss"' + (c.skip_spray ? ' checked' : '') + '> <span>Skip the spray</span></label>' +
      '<label class="fl"><span class="lbl">Office notes (crew sees these)</span><textarea class="f" id="f_on">' + h(c.office_notes || '') + '</textarea></label>' +
      '<div style="margin-top:16px"><button class="btn" id="fsave">Save</button></div>' +
      '<div class="hr" style="margin:26px 0 4px"></div><span class="lbl">Visits</span>' + (S.sel.visits.length ? '<table class="t"><tbody>' + S.sel.visits.map(function (v) {
        return '<tr><td class="mono" style="font-size:12px">' + h(dayLabel(v.day)) + '</td><td>' + tag(v.status) + (v.no_photo ? ' <span class="tag bad">No photo</span>' : '') + (v.note ? '<div style="font-size:13px;color:var(--mute)">' + h(v.note) + '</div>' : '') + '</td><td style="text-align:right">' + (v.photo_path ? '<button class="ib" data-photo="' + v.id + '">Photo</button>' : '') + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="empty">No visits yet.</p>') +
      '<span class="lbl" style="display:block;margin-top:22px">Texts</span>' + (S.sel.texts.length ? '<table class="t"><tbody>' + S.sel.texts.map(function (t) {
        return '<tr><td class="lbl" style="white-space:nowrap">' + h(t.kind.replace(/_/g, ' ')) + '</td><td style="font-size:13px">' + h(t.body) + '</td><td>' + h(t.status) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="empty">No texts yet.</p>');
    document.body.appendChild(el);
    el.querySelector('#dx').onclick = function () { S.sel = null; el.remove(); };
    var val = function (id) { var x = el.querySelector('#' + id); return x ? x.value : undefined; };
    el.querySelector('#fsave').onclick = async function () {
      var b = { id: c.id, service_day: val('f_sd'), stop_order: val('f_so'), scooper_id: val('f_sc'), pause_from: val('f_pf'), pause_until: val('f_pu'), gate_code: val('f_gc'), dog_names: val('f_dn'), gate_notes: val('f_gn'), problem_spots: val('f_ps'), office_notes: val('f_on'), skip_spray: el.querySelector('#f_ss').checked };
      if (String(val('f_dg') || '') !== String(c.dogs == null ? '' : c.dogs)) b.dogs = val('f_dg');
      if (el.querySelector('#f_sd2')) b.service_day2 = val('f_sd2');
      if (el.querySelector('#f_eow')) b.eow_week = val('f_eow');
      try { S.sel = await api('POST', '/api/office/customer', b); toast('Saved'); drawCustomer(); loadTab(); } catch (e) { toast(e.message); }
    };
    var pin = el.querySelector('#pin');
    if (pin) pin.onclick = async function () { try { S.sel = await api('POST', '/api/office/customer', { id: c.id, pin: true }); toast('On the map'); drawCustomer(); } catch (e) { toast(e.message); } };
    bindPhotos(el);
  }
  function bindPhotos(root) {
    root.querySelectorAll('[data-photo]').forEach(function (b) { b.onclick = async function () { try { var r = await api('GET', '/api/office/photo?stop=' + b.dataset.photo); window.open(r.url, '_blank', 'noopener'); } catch (e) { toast(e.message); } }; });
  }
  function bindOffice() {
    app.querySelectorAll('[data-plan]').forEach(function (b) { b.onclick = async function () {
      S.plan = b.dataset.plan === '1'; S.wk = S.wk || { cap: 30, days: '1,2,3,4,5', n: 500 };
      if (S.plan && !DEMO && !S.wk.loaded) { try { var st = await api('GET', '/api/office/settings'); S.wk.cap = st.cap; S.wk.days = st.days; S.wk.start = st.start || ''; S.wk.loaded = true; } catch (e) { } }
      if (!S.plan) { S.data.day = null; render(); return loadTab(); }
      render(); window.scrollTo(0, 0);
    }; });
    var saveSet = function () { if (!DEMO) api('POST', '/api/office/settings', { cap: S.wk.cap, days: S.wk.days }).then(function () { toast('Saved'); }).catch(function (e) { toast(e.message); }); S.data.week = null; render(); };
    app.querySelectorAll('[data-slot]').forEach(function (b) { b.onclick = function () { var n = +b.dataset.slot; S.wk.sel = n < 0 || S.wk.sel === n ? null : n; render(); var m = document.getElementById('wkmap'); if (m && S.wk.sel != null) m.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }; });
    if (S.plan && S.data.week && S.data.week.slots && S.data.week.mapsKey) keepMap('wkmap', [S.wk.sel, S.data.week.routes, S.data.week.weekMiles, S.data.week.cap, S.data.week.customers].join('|'), function (el) { wkMap(S.data.week, el); });
    app.querySelectorAll('[data-wkstart]').forEach(function (b) { b.onclick = function () { var v = (document.getElementById('wk_start') || {}).value || ''; api('POST', '/api/office/settings', { start: v }).then(function (r) { S.wk.start = r.start || ''; S.data.week = null; toast(r.start ? 'Start saved' : 'Start cleared'); render(); }).catch(function (e) { toast(e.message); }); }; });
    app.querySelectorAll('[data-cap]').forEach(function (b) { b.onclick = function () { S.wk.cap = +b.dataset.cap; saveSet(); }; });
    app.querySelectorAll('[data-wdays]').forEach(function (b) { b.onclick = function () { S.wk.days = b.dataset.wdays; saveSet(); }; });
    app.querySelectorAll('[data-wk]').forEach(function (b) { b.onclick = async function () {
      var o = S.wk, g = function (id) { var x = document.getElementById(id); return x ? x.value : null; };
      if (g('wk_n')) o.n = +g('wk_n');
      var save = b.dataset.wk === 'save';
      if (!save) o.mode = b.dataset.wk;
      var keep = S.data.week; S.data.week = { loading: true }; o.sel = null; render();
      try { S.data.week = await api('POST', '/api/office/week', { mode: o.mode || 'all', cap: o.cap, days: o.days, n: o.n, apply: save }); if (save) toast('Week saved'); }
      catch (e) { S.data.week = keep; toast(e.message); }
      render();
    }; });
    app.querySelectorAll('[data-day]').forEach(function (b) { b.onclick = function () { var n = +b.dataset.day; S.day = n === 0 ? S.data.day.today : shift(S.data.day.day, n); S.data.day = null; render(); loadTab(); }; });
    app.querySelectorAll('[data-goto]').forEach(function (b) { b.onclick = function () { S.day = b.dataset.goto; S.data.day = null; render(); loadTab(); }; });
    app.querySelectorAll('[data-open]').forEach(function (b) { b.onclick = function () { S.open = S.open || {}; S.open[b.dataset.open] = !S.open[b.dataset.open]; render(); }; });
    app.querySelectorAll('[data-menu]').forEach(function (b) { b.onclick = function () { stopMenu(b.dataset.menu); }; });
    app.querySelectorAll('[data-cust]').forEach(function (b) { b.onclick = function (e) { e.preventDefault(); openCustomer(b.dataset.cust); }; });
    app.querySelectorAll('[data-stop]').forEach(function (b) { b.onclick = async function () { try { S.data.day = await api('POST', '/api/office/stop', { id: b.dataset.stop, action: b.dataset.act }); render(); } catch (e) { toast(e.message); } }; });
    app.querySelectorAll('[data-move]').forEach(function (s) { s.onchange = async function () { if (!s.value) return; try { S.data.day = await api('POST', '/api/office/stop', { id: s.dataset.move, action: 'move', staffId: s.value }); toast('Moved. The old link stopped working.'); render(); } catch (e) { toast(e.message); } }; });
    app.querySelectorAll('[data-show]').forEach(function (b) { b.onclick = function () { S.show = b.dataset.show; S.data.customers = null; render(); loadTab(); }; });
    var q = document.getElementById('q'); if (q) { var tm; q.oninput = function () { clearTimeout(tm); tm = setTimeout(function () { S.q = q.value; loadTab(); }, 300); }; }
    app.querySelectorAll('[data-lead]').forEach(function (s) { s.onchange = async function () { try { S.data.leads = await api('POST', '/api/office/lead', { id: s.dataset.lead, status: s.value }); toast('Saved'); } catch (e) { toast(e.message); } }; });
    app.querySelectorAll('[data-leadnote]').forEach(function (b) { b.onclick = async function () { var l = S.data.leads.leads.filter(function (x) { return String(x.id) === b.dataset.leadnote; })[0]; sheetForm('Note', [{ id: 'n', label: 'Note', value: (l && l.notes) || '', area: true }], 'Save', async function (v) { try { S.data.leads = await api('POST', '/api/office/lead', { id: b.dataset.leadnote, notes: v.n }); render(); } catch (e) { toast(e.message); } }); }; });
    bindSend(app, false, loadTab);
    app.querySelectorAll('[data-text]').forEach(function (b) { b.onclick = async function () { try { await api('POST', '/api/office/text', { id: b.dataset.text, status: b.dataset.st }); loadTab(); } catch (e) { toast(e.message); } }; });
    app.querySelectorAll('[data-role]').forEach(function (s) { s.onchange = async function () { try { S.data.team = await api('POST', '/api/office/team', { id: s.dataset.role, role: s.value }); toast('Saved'); render(); } catch (e) { toast(e.message); loadTab(); } }; });
    app.querySelectorAll('[data-active]').forEach(function (b) { b.onclick = async function () { try { S.data.team = await api('POST', '/api/office/team', { id: b.dataset.active, active: b.dataset.on === '1' }); render(); } catch (e) { toast(e.message); } }; });
    app.querySelectorAll('[data-area]').forEach(function (s) { s.onchange = async function () { try { S.data.areas = await api('POST', '/api/office/area', { area: s.dataset.area, day: s.value }); toast('Saved'); render(); } catch (e) { toast(e.message); } }; });
    app.querySelectorAll('[data-tab]').forEach(function (b) { if (!b.classList.contains('tab')) b.onclick = function () { go(b.dataset.tab); }; });
    app.querySelectorAll('[data-o]').forEach(function (b) {
      b.onclick = async function () {
        var o = b.dataset.o; b.disabled = true;
        try {
          if (o === 'plan') { var r = await api('POST', '/api/office/plan', { date: S.data.day.day }); toast(r.added ? 'Added ' + r.added + ' yards' : 'Routes are up to date'); }
          if (o === 'night') { var n = await api('POST', '/api/office/night-before', {}); toast(n.queued + ' night before texts ready for ' + dayLabel(n.day)); }
          if (o === 'addstaff') { S.data.team = await api('POST', '/api/office/team', { name: val('tn'), email: val('te'), phone: val('tp'), role: val('tr') }); toast('Added'); }
          if (o === 'addlead') {
            b.disabled = false;
            return sheetForm('New lead', [{ id: 'nm', label: 'Name' }, { id: 'ph', label: 'Mobile number', type: 'tel' }, { id: 'dt', label: 'What do they need? Address, dogs, commercial', area: true }], 'Add lead', async function (v) {
              if (!v.nm.trim()) return toast('Type a name.');
              try { S.data.leads = await api('POST', '/api/office/lead', { kind: /hoa|apartment|business|commercial/i.test(v.dt) ? 'commercial' : 'phone', name: v.nm, phone: v.ph, details: v.dt }); render(); toast('Lead added'); } catch (e) { toast(e.message); }
            });
          }
        } catch (e) { toast(e.message); }
        b.disabled = false; loadTab();
      };
    });
    bindPhotos(app);
    function val(id) { var x = document.getElementById(id); return x ? x.value : ''; }
  }

  /* ---------- shell ---------- */
  var TABS = [['today', 'Schedule'], ['route', 'My route'], ['customers', 'Customers'], ['leads', 'Leads'], ['texts', 'Texts'], ['team', 'Team'], ['money', 'Money'], ['health', 'Health']];
  function go(t) { S.tab = t; S.plan = false; render(); loadTab(); }
  function shell(inner) {
    var tabs = S.view === 'office' ? TABS.map(function (t) {
      var n = t[0] === 'texts' && S.data.day && S.data.day.queuedTexts ? '<span class="n">' + S.data.day.queuedTexts + '</span>' : '';
      return '<button class="tab' + (S.tab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + n + '</button>';
    }).join('') : '<span class="tabs"></span>';
    return '<header class="bar"><div class="' + (S.view === 'office' ? 'wrap' : 'narrow') + ' in"><span class="brand"><img src="/assets/img/logo-horizontal-dark.svg" alt="Arizona Pet Waste" height="26" style="height:26px;width:auto;vertical-align:middle">' + (DEMO ? ' <span class="tag acc" style="margin-left:6px">Demo</span>' : '') + '</span><nav class="tabs">' + tabs + '</nav><button class="out" id="so">Sign out</button></div></header>' + inner;
  }
  function render() {
    var sx = window.scrollY;
    if (S.view === 'signin') { app.innerHTML = viewSignin(); return bindSignin(); }
    if (S.view === 'route') { app.innerHTML = shell(viewRoute()); bindRoute(); }
    if (S.view === 'office') { app.innerHTML = shell(viewOffice()); if (S.tab === 'route') bindRoute(); else bindOffice(); }
    var so = document.getElementById('so'); if (so) so.onclick = function () { sheetAsk('Sign out?', 'You will need a new code to sign back in.', 'Sign out', signOut, 'Stay signed in'); };
    app.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { go(b.dataset.tab); }; });
    window.scrollTo(0, sx);
  }
  async function boot() {
    if (DEMO) { S.role = 'owner'; S.view = 'office'; S.data.team = await api('GET', '/api/office/team'); toast('Demo. Made up yards. Nothing is saved.'); return go('today'); }
    var s = load();
    if (!s) { S.view = 'signin'; return render(); }
    try { var me = await api('GET', '/api/staff/me'); s.role = me.staff.role; s.name = me.staff.name; save(s); }
    catch (e) { if (!load()) return; toast(e.message); }
    S.role = s.role;
    if (s.role === 'scooper') { S.view = 'route'; render(); return refreshRoute(); }
    S.view = 'office';
    try { S.data.team = await api('GET', '/api/office/team'); } catch (e) { }
    go('today');
  }
  // Keep the office board fresh while it is open.
  setInterval(function () {
    if (document.visibilityState !== 'visible' || S.view !== 'office' || S.tab !== 'today' || document.querySelector('.drawer,.sheet')) return;
    api('GET', '/api/office/day?date=' + (S.data.day ? S.data.day.day : '')).then(function (d) { S.data.day = d; render(); }).catch(function () { });
  }, 30000);
  boot();
})();
</script>
</body>
</html>
